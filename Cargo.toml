[package]
name = "ascmhl"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Read and validate ASC Media Hash List (MHL) manifests: SHA-256, SHA-1 and MD5 recomputed; xxh64, xxh3 and c4 detected and reported as unvalidated"
homepage = "https://hiberden.app"
repository = "https://github.com/Agaveis/ascmhl"
readme = "README.md"
keywords = ["asc-mhl", "mhl", "checksum", "media", "manifest"]
categories = ["parser-implementations", "filesystem"]
authors = ["Agaveis"]
exclude = [".github/"]

[dependencies]
# The manifest is XML; the three recomputed digests are the RustCrypto crates.
quick-xml = "0.37"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
# The compact validation record derives Serialize and Deserialize so a caller
# can store it next to its own records.
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
