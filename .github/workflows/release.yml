name: Release to crates.io

# Runs on a version tag (v0.1.1) and publishes that version. Authentication is
# crates.io Trusted Publishing: the job's GitHub OIDC token is exchanged for a
# short-lived crates.io token, so no long-lived secret lives in this repository.
# Trusted Publishing is configured once on the crate's crates.io settings page
# (repository Agaveis/ascmhl, workflow release.yml) after the first publish,
# which is done by hand from a local cargo login.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust stable from the runner's rustup
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: The tag must match Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json;print(json.load(sys.stdin)['packages'][0]['version'])")
          [ "$TAG" = "$CARGO" ] || { echo "::error::tag $TAG does not match Cargo.toml version $CARGO"; exit 1; }

      - run: cargo test

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
